<!DOCTYPE html>
<html lang="cs" data-lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sontradex — Est. MMCI</title>
  <meta name="description" content="Wood. Nature. Eco. Circular economy since 2001. Prague." />
  <meta property="og:title" content="Sontradex" />
  <meta property="og:description" content="Wood. Nature. Eco. Circular economy since 2001." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f5f2ec" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..900;1,9..144,200..900&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500&display=swap" rel="stylesheet">

  <style>
    /*
      Art direction: Heritage eco-lifestyle holding page
      Tone: quiet luxury, organic, timeless — not trendy
      Palette: warm linen / forest green / charcoal
      Typography: Fraunces (display) + Satoshi (body)
      Density: very spacious — white space is confidence
    */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #f5f2ec;
      --text:   #1c1914;
      --muted:  #7a7560;
      --faint:  #b0ac99;
      --accent: #3a5c3a;
      --border: rgba(28,25,20,0.11);

      --font-d: 'Fraunces', Georgia, serif;
      --font-b: 'Satoshi', 'Helvetica Neue', sans-serif;

      --xs:  clamp(0.6875rem, 0.66rem + 0.14vw, 0.8125rem);
      --sm:  clamp(0.8125rem, 0.78rem + 0.16vw, 0.9375rem);
      --md:  clamp(0.9375rem, 0.9rem  + 0.19vw, 1.0625rem);
      --lg:  clamp(1.125rem,  1rem    + 0.6vw,  1.5rem);
      --xl:  clamp(1.5rem,    1.2rem  + 1.2vw,  2.25rem);
      --disp:clamp(2.8rem,    1.2rem  + 5.5vw,  6rem);
    }

    html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; scroll-behavior:smooth; }

    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-b); font-size: var(--md); line-height: 1.6;
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    ::selection { background: rgba(58,92,58,0.14); }

    /* NAV */
    .site-header {
      position: fixed; inset: 0 0 auto; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.75rem 2.75rem;
    }

    .logo-area { display: flex; align-items: center; height: 28px; }
    #hdr-img   { height: 28px; width: auto; }
    #hdr-txt   {
      font-family: var(--font-d); font-size: var(--sm); font-weight: 300;
      letter-spacing: 0.32em; color: var(--text); text-transform: uppercase;
      font-variation-settings: 'opsz' 14, 'wght' 300;
    }

    .lang-nav { display: flex; align-items: center; gap: 0.25rem; }
    .lang-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-b); font-size: var(--xs); font-weight: 400;
      letter-spacing: 0.09em; color: var(--faint); padding: 4px 7px;
      border-radius: 2px; transition: color 160ms ease; line-height: 1;
    }
    .lang-btn:hover        { color: var(--text); }
    .lang-btn.active       { color: var(--text); font-weight: 500; }
    .lang-sep              { color: var(--faint); font-size: var(--xs); user-select: none; opacity:.5; pointer-events:none; }

    /* MAIN */
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 9rem 2.75rem 5rem;
    }

    .center-block {
      max-width: 680px; width: 100%; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }

    .brand-mark { margin-bottom: 3rem; }
    #brand-img  { height: 72px; width: auto; margin: 0 auto; display: block; }
    #brand-txt  {
      font-family: var(--font-d); font-size: var(--xl); font-weight: 200;
      letter-spacing: 0.42em; color: var(--text); text-transform: uppercase;
      font-variation-settings: 'opsz' 36, 'wght' 200;
    }

    .rule      { width: 40px;  height: 1px; background: var(--border); margin: 0 auto 2.5rem; }
    .rule-wide { width: 100%; max-width: 320px; height: 1px; background: var(--border); margin: 2.5rem auto; }

    .kicker {
      font-family: var(--font-b); font-size: var(--xs); font-weight: 400;
      letter-spacing: 0.18em; color: var(--faint); text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-family: var(--font-d); font-size: var(--disp); font-weight: 300;
      line-height: 1.08; letter-spacing: -0.01em; color: var(--text);
      margin-bottom: 1.75rem; font-variation-settings: 'opsz' 72, 'wght' 300;
      font-style: italic;
    }

    .tagline {
      font-family: var(--font-b); font-size: var(--md); font-weight: 300;
      color: var(--muted); line-height: 1.75; max-width: 44ch; margin: 0 auto;
    }

    .heritage {
      font-family: var(--font-b); font-size: var(--xs); font-weight: 400;
      color: var(--faint); letter-spacing: 0.03em; line-height: 1.7;
      max-width: 48ch; margin: 1.1rem auto 0;
    }

    .coming {
      font-family: var(--font-b); font-size: var(--xs); font-weight: 400;
      letter-spacing: 0.13em; color: var(--faint); text-transform: uppercase; line-height: 2;
    }

    /* SUBSCRIBE */
    .subscribe-wrap { margin-top: 2.5rem; width: 100%; }

    .sub-form {
      display: flex; border: 1px solid var(--border); border-radius: 1px;
      overflow: hidden; max-width: 360px; margin: 0 auto;
      background: transparent; transition: border-color 200ms ease;
    }
    .sub-form:focus-within { border-color: rgba(28,25,20,0.28); }

    .sub-input {
      flex: 1; min-width: 0; background: transparent; border: none; outline: none;
      font-family: var(--font-b); font-size: var(--sm); font-weight: 300;
      color: var(--text); padding: 0.65rem 1rem; letter-spacing: 0.01em;
    }
    .sub-input::placeholder { color: var(--faint); }

    .sub-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      cursor: pointer; padding: 0.65rem 1.1rem; color: var(--muted);
      font-family: var(--font-b); font-size: var(--xs); font-weight: 400;
      letter-spacing: 0.1em; text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
      white-space: nowrap; flex-shrink: 0;
    }
    .sub-btn:hover    { background: var(--text); color: var(--bg); border-left-color: var(--text); }
    .sub-btn:disabled { opacity: .5; cursor: not-allowed; }

    .sub-note {
      font-size: var(--xs); color: var(--faint); margin-top: 0.875rem; letter-spacing: 0.04em;
    }

    .sub-ok {
      font-family: var(--font-b); font-size: var(--sm); color: var(--accent);
      margin-top: 0.875rem; letter-spacing: 0.06em; font-weight: 400;
      opacity: 0; transition: opacity 400ms ease;
    }
    .sub-ok.on { opacity: 1; }

    /* FOOTER */
    footer {
      padding: 1.75rem 2.75rem; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .ft { font-family: var(--font-b); font-size: var(--xs); color: var(--faint); letter-spacing: 0.05em; }

    /* FADE IN */
    .fi { opacity: 0; animation: fi 1.1s cubic-bezier(0.16,1,0.3,1) forwards; }
    .fi:nth-child(1)  { animation-delay:.08s }
    .fi:nth-child(2)  { animation-delay:.22s }
    .fi:nth-child(3)  { animation-delay:.36s }
    .fi:nth-child(4)  { animation-delay:.50s }
    .fi:nth-child(5)  { animation-delay:.62s }
    .fi:nth-child(6)  { animation-delay:.74s }
    .fi:nth-child(7)  { animation-delay:.86s }
    .fi:nth-child(8)  { animation-delay:.98s }
    .fi:nth-child(9)  { animation-delay:1.10s }
    .fi:nth-child(10) { animation-delay:1.22s }
    @keyframes fi { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fi { opacity:1; animation:none; } }

    @media (max-width: 560px) {
      .site-header { padding: 1.25rem 1.5rem; }
      main { padding: 7rem 1.5rem 4rem; }
      footer { flex-direction: column; align-items: flex-start; gap:.25rem; padding:1.5rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo-area">
      <img id="hdr-img" src="/logo.png" alt="Sontradex"
           onerror="this.hidden=true;document.getElementById('hdr-txt').hidden=false;" />
      <span id="hdr-txt" hidden>Sontradex</span>
    </div>
    <nav class="lang-nav" aria-label="Language">
      <button class="lang-btn active" data-lang="cs">CZ</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button class="lang-btn" data-lang="de">DE</button>
      <span class="lang-sep" aria-hidden="true">/</span>
      <button class="lang-btn" data-lang="en">EN</button>
    </nav>
  </header>

  <main>
    <div class="center-block">

      <div class="brand-mark fi">
        <img id="brand-img" src="/logo.png" alt="Sontradex"
             onerror="this.hidden=true;document.getElementById('brand-txt').hidden=false;" />
        <span id="brand-txt" hidden>Sontradex</span>
      </div>

      <div class="rule fi"></div>
      <p  class="kicker fi"  id="kicker"></p>
      <h1 class="fi"         id="headline"></h1>
      <p  class="tagline fi" id="tagline"></p>
      <p  class="heritage fi" id="heritage"></p>
      <div class="rule-wide fi"></div>
      <p  class="coming fi"  id="coming"></p>

      <div class="subscribe-wrap fi">
        <form class="sub-form" id="sub-form" novalidate>
          <input class="sub-input" type="email" id="sub-email" autocomplete="email" required />
          <button class="sub-btn" type="submit" id="sub-btn"></button>
        </form>
        <p class="sub-note" id="sub-note"></p>
        <p class="sub-ok"   id="sub-ok"></p>
      </div>

    </div>
  </main>

  <footer>
    <span class="ft" id="ft-founded"></span>
    <span class="ft">&#169; 2026 Sontradex s.r.o.</span>
  </footer>

  <script>
    // ─── GOOGLE SHEETS ───────────────────────────────────────────
    // Nahraď URL po deployi Google Apps Script (viz README.md)
    const GS_URL = 'https://script.google.com/macros/s/AKfycbwko_2b8R3ylff7YlDsTxbk3TT0zmzrD5FkISdw-7GIflppMk-y1_cn5-h92aZJM3as/exec';
// ─── PŘEKLADY ────────────────────────────────────────────────
    const T = {
      cs: {
        kicker:  'Holding · Est. MMI · Praha',
        h1:      'Tradice. Respekt. Rovnováha.',
        tagline: 'Od roku 2001 dáváme věcem druhý smysl. Bez zkratek a s hlubokou úctou ke světu, který si jen půjčujeme.',
        heritage:'Na sklonku roku 2001 vznikla v Praze rodinná vize, která dnes přesahuje čtvrt století. Nenápadně, ale vytrvale vracíme rovnováhu tam, kam patří.',
        coming:  'Cirkulární ekonomika · Rodinný holding',
        ph:      'Váš e-mail',
        cta:     'Zůstat v kontaktu',
        note:    'Žádný spam. Jen to podstatné.',
        ok:      'Děkujeme. Brzy se ohlásíme.',
        founded: 'Na sklonku roku 2001 založeno v Praze.',
      },
      de: {
        kicker:  'Holding · Est. MMI · Prag',
        h1:      'Tradition. Respekt. Gleichgewicht.',
        tagline: 'Seit 2001 geben wir Dingen einen zweiten Sinn. Ohne Abkürzungen und mit tiefem Respekt vor einer Welt, die wir nur leihen.',
        heritage:'Ende 2001 entstand in Prag eine familiäre Vision, die heute über ein Vierteljahrhundert andauert. Unauffällig, aber beharrlich bringen wir das Gleichgewicht dorthin zurück, wo es hingehört.',
        coming:  'Kreislaufwirtschaft · Familienholding',
        ph:      'Ihre E-Mail',
        cta:     'In Kontakt bleiben',
        note:    'Kein Spam. Nur das Wesentliche.',
        ok:      'Danke. Wir melden uns in Kürze.',
        founded: 'Ende 2001 in Prag gegründet.',
      },
      en: {
        kicker:  'Holding · Est. MMI · Prague',
        h1:      'Tradition. Respect. Balance.',
        tagline: 'Giving things a second purpose since 2001. No shortcuts, just profound respect for a world we only borrow.',
        heritage:'Founded in Prague in late 2001, our family vision now spans over a quarter of a century. Quietly but persistently, we restore balance where it belongs.',
        coming:  'Circular Economy · Family Holding',
        ph:      'Your email',
        cta:     'Stay in touch',
        note:    'No spam. Just what matters.',
        ok:      "Thank you. We'll be in touch.",
        founded: 'Founded in Prague in late 2001.',
      },
    };

    // ─── AUTODETEKCE JAZYKA PODLE DOMÉNY ─────────────────────────
    let lang = 'cs'; // výchozí
    const host = window.location.hostname || '';
    
    if (host.endsWith('.de')) {
      lang = 'de';
    } else if (host.endsWith('.com')) {
      lang = 'en';
    }

    function render(l) {
      const t = T[l] || T.cs; lang = l;
      document.documentElement.lang = l;
      document.getElementById('kicker').textContent   = t.kicker;
      document.getElementById('headline').textContent = t.h1;
      document.getElementById('tagline').textContent  = t.tagline;
      document.getElementById('heritage').textContent = t.heritage;
      document.getElementById('coming').textContent   = t.coming;
      document.getElementById('sub-email').placeholder = t.ph;
      document.getElementById('sub-btn').textContent  = t.cta;
      document.getElementById('sub-note').textContent = t.note;
      document.getElementById('sub-ok').textContent   = t.ok;
      document.getElementById('ft-founded').textContent = t.founded;
      document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === l));
      document.getElementById('sub-ok').classList.remove('on');
    }

    document.querySelectorAll('.lang-btn').forEach(b =>
      b.addEventListener('click', () => render(b.dataset.lang)));

    document.getElementById('sub-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('sub-email').value.trim();
      if (!email || !email.includes('@')) return;
      const btn = document.getElementById('sub-btn');
      btn.disabled = true; btn.textContent = '…';

      fetch(GS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, lang, timestamp: new Date().toISOString(), source: host || 'sontradex' })
      }).catch(() => {});

      document.getElementById('sub-email').value = '';
      document.getElementById('sub-ok').classList.add('on');
      btn.textContent = T[lang].cta; btn.disabled = false;
    });

    // Spuštění s detekovaným jazykem
    render(lang);
 
  </script>
</body>
</html>
